name: Verificación

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisión de código
        run: npm run lint
      - name: Pruebas de la base de datos (seguridad y funciones)
        run: npm run test:db
      - name: Compilación
        run: npm run build
